<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNAS - Interactive Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #05060f;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(30, 40, 85, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(60, 20, 70, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 10% 60%, rgba(15, 35, 65, 0.4) 0%, transparent 50%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated twinkling stars background layer */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: transparent url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 800 800"><circle cx="100" cy="100" r="1" fill="%23ffffff" opacity="0.8"/><circle cx="250" cy="400" r="1.5" fill="%23ffffff" opacity="0.6"/><circle cx="500" cy="150" r="1.2" fill="%2360a5fa" opacity="0.9"/><circle cx="700" cy="300" r="1" fill="%23ffffff" opacity="0.7"/><circle cx="350" cy="650" r="1.8" fill="%2338bdf8" opacity="0.8"/><circle cx="600" cy="700" r="1" fill="%23ffffff" opacity="0.5"/><circle cx="150" cy="550" r="1.3" fill="%23ffffff" opacity="0.9"/></svg>') repeat;
            animation: starsMove 100s linear infinite;
        }

        @keyframes starsMove {
            from { background-position: 0 0; }
            to { background-position: 800px 800px; }
        }

        /* Custom Header Styling */
        .annas-title {
            font-family: 'Permanent Marker', cursive, sans-serif;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6),
                         0 0 30px rgba(59, 130, 246, 0.4);
        }

        /* Glassmorphism Fieldset Cards */
        .glass-fieldset {
            position: relative;
            background: rgba(13, 16, 27, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                        inset 0 0 15px rgba(255, 255, 255, 0.03);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-fieldset:hover {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(59, 130, 246, 0.25),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        /* Fieldset Legend Labeling */
        .glass-legend {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #080c18;
            padding: 2px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Hologram Floating Animation Effect */
        @keyframes floatHologram {
            0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4)); }
            50% { transform: translateY(-8px) scale(1.01); filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.7)); }
        }

        .hologram-animate {
            animation: floatHologram 4s ease-in-out infinite;
        }

        /* Jordan Silhouette Float & Pulse */
        @keyframes floatJordan {
            0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2)); }
            50% { transform: translateY(-10px) rotate(1deg); filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.5)); }
        }

        .jordan-animate {
            animation: floatJordan 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen px-4 py-8 relative">

    <!-- Starry Outer Space Background Layer -->
    <div class="stars-container"></div>

    <!-- Main Outer Wrapper -->
    <div class="w-full max-w-5xl z-10 flex flex-col items-center">

        <!-- Top Header Title -->
        <header class="mb-8 text-center">
            <h1 class="annas-title text-5xl md:text-6xl text-white uppercase tracking-widest select-none">
                ANNAS
            </h1>
        </header>

        <!-- Main Content Layout Grid -->
        <main class="w-full grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            
            <!-- TOP LEFT: Interests Panel -->
            <div class="md:col-span-8 glass-fieldset p-6 pt-8 mt-2 relative group">
                <span class="glass-legend">Interests</span>
                
                <div class="w-full flex items-center justify-center min-h-[220px]">
                    <img 
                        src="interests.png" 
                        alt="Interests Grid: Gym, Soccer, Car, Ramen, Controller, Mountains" 
                        class="w-full h-auto max-h-[300px] object-contain transition-transform duration-300 group-hover:scale-[1.02]"
                        onerror="this.onerror=null; this.src='https://placehold.co/600x320/0a0e1a/38bdf8?text=Interests+Image+(interests.png)';"
                    />
                </div>
            </div>

            <!-- TOP RIGHT: Jordan Jumpman Silhouette -->
            <div class="md:col-span-4 flex justify-center items-center p-4 min-h-[260px] relative">
                <img 
                    src="jordan.png" 
                    alt="Galactic Metallic Jordan Silhouette" 
                    class="jordan-animate w-64 md:w-80 h-auto object-contain cursor-pointer hover:scale-105 transition-transform duration-300"
                    onerror="this.onerror=null; this.src='https://placehold.co/300x300/0a0e1a/e2e8f0?text=Jordan+Silhouette+(jordan.png)';"
                />
            </div>

            <!-- BOTTOM LEFT COLUMN: RPG Stats & Hologram Character -->
            <div class="md:col-span-5 flex flex-col items-center gap-6">
                
                <!-- RPG Stat Box -->
                <div class="w-full relative group">
                    <img 
                        src="stats.png" 
                        alt="Equipped Stats Panel" 
                        class="w-full h-auto object-contain rounded-xl shadow-lg border border-slate-700/50 transition-all duration-300 group-hover:border-cyan-500/50 group-hover:shadow-cyan-900/30"
                        onerror="this.onerror=null; this.src='https://placehold.co/400x230/111827/38bdf8?text=Stats+Panel+(stats.png)';"
                    />
                </div>

                <!-- Hologram Anime Character -->
                <div class="w-full flex justify-center py-2">
                    <img 
                        src="hologram.png" 
                        alt="Hologram Anime Character" 
                        class="hologram-animate w-48 md:w-56 h-auto object-contain cursor-pointer"
                        onerror="this.onerror=null; this.src='https://placehold.co/200x320/0a0e1a/38bdf8?text=Hologram+(hologram.png)';"
                    />
                </div>

            </div>

            <!-- BOTTOM RIGHT: Experiences Panel -->
            <div class="md:col-span-7 glass-fieldset p-6 pt-8 mt-2 relative group">
                <span class="glass-legend">Experiences</span>
                
                <div class="w-full flex items-center justify-center min-h-[300px]">
                    <img 
                        src="experiences.png" 
                        alt="Experiences Collages: Diving, Stadium, NY Landmarks, Spanish, Fencing, Zipline" 
                        class="w-full h-auto max-h-[420px] object-contain transition-transform duration-300 group-hover:scale-[1.02]"
                        onerror="this.onerror=null; this.src='https://placehold.co/600x400/0a0e1a/38bdf8?text=Experiences+Image+(experiences.png)';"
                    />
                </div>
            </div>

        </main>
    </div>

    <footer class="mt-12 text-slate-400 text-xs text-center z-10 opacity-70 hover:opacity-100 transition-opacity">
        <p>© ANNAS Personal Portfolio. Built for GitHub Pages.</p>
    </footer>

</body>
</html>
